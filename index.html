<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16161a" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Читальня">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Читальня</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">

<div id="app">
  <header class="top">
    <h1 id="viewTitle">Бібліотека</h1>
    <div class="topBtns">
      <button id="importBtn" class="iconBtn" aria-label="Додати файл" title="Додати файл з телефону"></button>
      <button id="gearBtn" class="iconBtn" aria-label="Налаштування"></button>
    </div>
  </header>

  <main>
    <section id="libView" class="view">
      <div id="libEmpty" class="empty" hidden>
        <div class="emptyIcon"></div>
        <h2>Тут поки порожньо</h2>
        <p>Знайди книгу у вкладці «Пошук» і завантаж її, або додай власний файл (EPUB, FB2, TXT).</p>
        <button id="emptySearch" class="btn primary">Шукати книги</button>
      </div>
      <div id="libGrid" class="grid"></div>
    </section>

    <section id="searchView" class="view" hidden>
      <form id="searchForm" class="searchBox" autocomplete="off">
        <input id="q" type="search" placeholder="Назва книги або автор" enterkeyhint="search" autocapitalize="off" autocorrect="off">
        <button class="btn primary" type="submit">Знайти</button>
      </form>
      <div class="chips" id="srcChips">
        <button class="chip on" data-src="gutenberg">Gutenberg</button>
        <button class="chip" data-src="wikisource">Вікіджерела</button>
        <button class="chip" data-src="archive">Archive.org</button>
      </div>
      <div class="chips" id="langChips">
        <button class="chip on" data-lang="">Будь-яка мова</button>
        <button class="chip" data-lang="uk">Українська</button>
        <button class="chip" data-lang="en">English</button>
        <button class="chip" data-lang="de">Deutsch</button>
        <button class="chip" data-lang="pl">Polski</button>
      </div>
      <div class="chips" id="shelfChips"></div>
  <div id="srcNote" class="note"></div>
      <div id="results"></div>
    </section>
  </main>

  <nav class="tabs">
    <button class="tab on" data-view="libView"><i></i><span>Бібліотека</span></button>
    <button class="tab" data-view="searchView"><i></i><span>Пошук</span></button>
  </nav>
</div>

<!-- Reader -->
<div id="reader" hidden>
  <div id="rScroll"><article id="rPage"></article></div>
  <div id="rTop" class="rbar top">
    <button id="rBack" class="iconBtn" aria-label="Назад"></button>
    <div id="rTitle"></div>
    <button id="rToc" class="iconBtn" aria-label="Зміст"></button>
    <button id="rAa" class="iconBtn" aria-label="Вигляд"></button>
  </div>
  <div id="rBottom" class="rbar bottom">
    <input id="rSlider" type="range" min="0" max="1000" value="0" aria-label="Позиція в книзі">
    <div id="rInfo"><span id="rChap"></span><span id="rPct"></span></div>
  </div>
  <div id="rTocPanel" class="sheet" hidden>
    <div class="sheetHead"><b>Зміст</b><button class="iconBtn closeBtn" data-close="rTocPanel"></button></div>
    <div id="tocList"></div>
  </div>
  <div id="rPanel" class="sheet small" hidden>
    <div class="sheetHead"><b>Вигляд</b><button class="iconBtn closeBtn" data-close="rPanel"></button></div>
    <div class="row"><span>Розмір</span><div class="stepper"><button id="fsMinus">A−</button><b id="fsVal"></b><button id="fsPlus">A+</button></div></div>
    <div class="row"><span>Шрифт</span><div class="seg" id="fontSeg"><button data-v="serif">З засічками</button><button data-v="sans">Без засічок</button></div></div>
    <div class="row"><span>Міжряддя</span><div class="seg" id="lhSeg"><button data-v="1.4">Щільно</button><button data-v="1.65">Норма</button><button data-v="1.95">Вільно</button></div></div>
    <div class="row"><span>Поля</span><div class="seg" id="mgSeg"><button data-v="10">Вузькі</button><button data-v="20">Норма</button><button data-v="34">Широкі</button></div></div>
    <div class="row"><span>Тема</span><div class="seg themes" id="themeSeg"><button data-v="light">Світла</button><button data-v="sepia">Сепія</button><button data-v="dark">Темна</button></div></div>
  </div>
</div>

<!-- Settings sheet -->
<div id="settings" class="modal" hidden>
  <div class="modalCard">
    <div class="sheetHead"><b>Налаштування</b><button class="iconBtn closeBtn" data-close="settings"></button></div>
    <label class="field">
      <span>Свій CORS-проксі (необов'язково)</span>
      <input id="proxyIn" type="url" placeholder="https://my-proxy.workers.dev/?url={url}">
      <small>Використовується, якщо сайт з книгами не дозволяє завантаження напряму. Додай <code>{url}</code> туди, куди треба підставити адресу.</small>
    </label>
    <div class="row"><span>Тема</span><div class="seg themes" id="themeSeg2"><button data-v="light">Світла</button><button data-v="sepia">Сепія</button><button data-v="dark">Темна</button></div></div>
    <div id="storageInfo" class="note"></div>
    <button id="saveSettings" class="btn primary wide">Зберегти</button>
  </div>
</div>

<!-- Book action sheet -->
<div id="bookMenu" class="modal" hidden>
  <div class="modalCard">
    <div class="sheetHead"><b id="bmTitle"></b><button class="iconBtn closeBtn" data-close="bookMenu"></button></div>
    <div id="bmInfo" class="note"></div>
    <button id="bmOpen" class="btn primary wide">Читати</button>
    <button id="bmDelete" class="btn danger wide">Видалити з бібліотеки</button>
  </div>
</div>

<div id="toast" hidden></div>
<input id="fileIn" type="file" accept=".epub,.fb2,.txt,.zip,application/epub+zip,text/plain" multiple hidden>

<script src="vendor/jszip.min.js"></script>
<script src="app.js"></script>
</body>
</html>
